<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wind Divin Outreach Tracker</title>

  <!-- Pico.css (classless base) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    /* ============================================================
       PREMIUM UI LAYER  (sits on top of Pico.css)
       ============================================================ */
    :root {
      --brand: #6d28d9;          /* deep violet */
      --brand-soft: #ede9fe;
      --ink: #1e1b2e;
      --muted: #6b7280;
      --line: #e7e5ef;
      --bg: #f6f5fb;
      --card: #ffffff;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(17,12,46,.04), 0 8px 24px rgba(17,12,46,.06);
      --shadow-lg: 0 4px 12px rgba(17,12,46,.08), 0 16px 48px rgba(17,12,46,.10);
      /* status colors */
      --st-red: #ef4444;     --st-red-bg: #fee2e2;
      --st-yellow: #d97706;  --st-yellow-bg: #fef3c7;
      --st-blue: #2563eb;    --st-blue-bg: #dbeafe;
      --st-green: #16a34a;   --st-green-bg: #dcfce7;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main.container { max-width: 1180px; padding-block: 1.5rem; }

    /* ---------- Header ---------- */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
      background: linear-gradient(135deg, var(--brand) 0%, #9333ea 100%);
      color: #fff;
      padding: 1.5rem 1.75rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      margin-bottom: 1.5rem;
    }
    .app-header h1 { margin: 0; font-size: 1.6rem; line-height: 1.2; color:#fff; }
    .app-header .sub { margin: .25rem 0 0; font-size: .85rem; opacity: .85; }
    .header-actions { display:flex; align-items:center; gap:.75rem; }
    .updated { font-size: .8rem; opacity: .9; white-space: nowrap; }
    .btn-refresh {
      background: rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.35);
      padding: .5rem .9rem; border-radius: 10px; font-size: .85rem; font-weight: 600;
      cursor: pointer; transition: background .15s ease; width:auto; margin:0;
    }
    .btn-refresh:hover { background: rgba(255,255,255,.3); }
    .btn-refresh:disabled { opacity:.6; cursor: wait; }

    /* ---------- Stat cards ---------- */
    .stats-grid {
      display: grid; gap: 1rem; margin-bottom: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .stat-card {
      background: var(--card); border:1px solid var(--line);
      border-radius: var(--radius); padding: 1.1rem 1.2rem; box-shadow: var(--shadow);
    }
    .stat-card .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight:600; }
    .stat-card .value { font-size: 1.9rem; font-weight: 700; line-height: 1.1; margin-top: .25rem; }
    .stat-card.total { background: var(--ink); color:#fff; border-color: var(--ink); }
    .stat-card.total .label { color: rgba(255,255,255,.7); }
    .stat-card .accent { width: 36px; height: 4px; border-radius: 4px; margin-top:.6rem; }

    .section-title { font-size: .8rem; text-transform: uppercase; letter-spacing:.06em; color: var(--muted); font-weight:700; margin: 0 0 .75rem; }

    /* ---------- Panels ---------- */
    .panel {
      background: var(--card); border:1px solid var(--line);
      border-radius: var(--radius); padding: 1.25rem 1.4rem; box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .chart-wrap { max-width: 720px; margin: 0 auto; }

    /* ---------- Filter bar ---------- */
    .filter-bar { display:grid; gap: .9rem; grid-template-columns: 2fr 1fr 1fr 1fr; align-items:end; }
    @media (max-width: 900px){ .filter-bar { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px){ .filter-bar { grid-template-columns: 1fr; } }
    .field label { font-size:.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:.35rem; }
    .field input[type="search"], .field select {
      margin:0; border-radius:10px; border:1px solid var(--line); background:#fff; height: 42px;
    }

    /* custom multiselect dropdown */
    .ms { position: relative; }
    .ms-toggle {
      width:100%; height:42px; border:1px solid var(--line); border-radius:10px; background:#fff;
      display:flex; align-items:center; justify-content:space-between; padding:0 .8rem; cursor:pointer;
      font-size:.9rem; color:var(--ink);
    }
    .ms-toggle .chev { color: var(--muted); transition: transform .15s; }
    .ms.open .ms-toggle .chev { transform: rotate(180deg); }
    .ms-menu {
      position:absolute; z-index:30; top:46px; left:0; right:0; background:#fff;
      border:1px solid var(--line); border-radius:12px; box-shadow: var(--shadow-lg);
      padding:.4rem; max-height: 260px; overflow:auto; display:none;
    }
    .ms.open .ms-menu { display:block; }
    .ms-menu label {
      display:flex; align-items:center; gap:.55rem; padding:.45rem .55rem; border-radius:8px;
      font-size:.88rem; cursor:pointer; text-transform:none; letter-spacing:0; color:var(--ink); font-weight:500; margin:0;
    }
    .ms-menu label:hover { background: var(--brand-soft); }
    .ms-menu input { margin:0; width:auto; }
    .ms-count { background: var(--brand); color:#fff; font-size:.7rem; font-weight:700; border-radius:999px; padding:.05rem .45rem; margin-left:.4rem; }

    .filter-meta { display:flex; align-items:center; justify-content:space-between; margin-top:1rem; flex-wrap:wrap; gap:.5rem; }
    .filter-meta .count { font-size:.85rem; color:var(--muted); }
    .btn-clear { background:none; border:none; color:var(--brand); font-weight:600; font-size:.85rem; cursor:pointer; padding:.25rem; width:auto; margin:0; }

    /* ---------- Table ---------- */
    .table-scroll { overflow-x:auto; border-radius: var(--radius); }
    table { margin:0; font-size:.88rem; }
    thead th {
      position: sticky; top:0; background:#faf9fe; cursor:pointer; user-select:none;
      font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
      white-space:nowrap; border-bottom:2px solid var(--line);
    }
    thead th .arrow { opacity:.4; font-size:.7rem; }
    thead th.sorted .arrow { opacity:1; color:var(--brand); }
    tbody td { vertical-align: top; border-bottom:1px solid var(--line); }
    tbody tr:hover { background: #faf9fe; }
    td.name { font-weight:600; min-width: 180px; }
    td.notes { color:var(--muted); max-width: 360px; font-size:.82rem; }
    td.contact a { word-break: break-all; }

    .cat-tag { display:inline-block; font-size:.72rem; font-weight:600; padding:.15rem .5rem; border-radius:6px; background:var(--brand-soft); color:var(--brand); white-space:nowrap; }

    .badge { display:inline-block; font-size:.74rem; font-weight:700; padding:.2rem .6rem; border-radius:999px; white-space:nowrap; }
    .badge.red    { background:var(--st-red-bg);    color:var(--st-red); }
    .badge.yellow { background:var(--st-yellow-bg); color:var(--st-yellow); }
    .badge.blue   { background:var(--st-blue-bg);   color:var(--st-blue); }
    .badge.green  { background:var(--st-green-bg);  color:var(--st-green); }
    .badge.gray   { background:#eef0f4;             color:#6b7280; }

    /* ---------- Pagination ---------- */
    .pager { display:flex; align-items:center; justify-content:center; gap:.5rem; margin-top:1.1rem; flex-wrap:wrap; }
    .pager button {
      width:auto; margin:0; padding:.4rem .8rem; font-size:.85rem; border-radius:8px;
      border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
    }
    .pager button:hover:not(:disabled){ border-color:var(--brand); color:var(--brand); }
    .pager button:disabled { opacity:.4; cursor:not-allowed; }
    .pager .page-info { font-size:.85rem; color:var(--muted); }

    /* ---------- States ---------- */
    .state {
      text-align:center; padding:3rem 1.5rem; background:var(--card);
      border:1px dashed var(--line); border-radius: var(--radius); color:var(--muted);
    }
    .state.error { border-color:#fca5a5; background:#fef2f2; color:#b91c1c; }
    .state h3 { margin-top:0; }
    .spinner {
      width:34px; height:34px; border:3px solid var(--brand-soft); border-top-color:var(--brand);
      border-radius:50%; animation:spin 1s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    code.url { background:#f1f0f8; padding:.15rem .4rem; border-radius:6px; font-size:.82rem; }

    /* ---------- Password gate ---------- */
    #gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:100; }
    #gate .box { background:var(--card); padding:2rem; border-radius:var(--radius); box-shadow:var(--shadow-lg); width:min(360px,90vw); text-align:center; }
    #gate input { margin:.75rem 0; }
    #gate .err { color:var(--st-red); font-size:.85rem; min-height:1.2em; }
  </style>
</head>
<body>

  <!-- ============================================================
       CONFIGURATION  —  edit these three constants only
       ============================================================ -->
  <script>
    /* 1) PASTE YOUR PUBLISHED GOOGLE SHEET CSV URL HERE.
          It must be the "Publish to web -> Comma-separated values (.csv)" link,
          which looks like:
          https://docs.google.com/spreadsheets/d/e/2PACX-xxxx/pub?output=csv
          Leave as "" and the page will show setup instructions instead of erroring. */
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRndjfinZufR49wxq352YqbfmkjFg1NW29UlyPVDY-p6X12jT8cg-1fkE9zYmAfFXnw1ND1VmuSoE_k/pub?output=csv";

    /* 2) Optional password gate. Leave "" to disable (no gate shown).
          NOTE: this is client-side only and visible in page source — it deters
          casual viewers but is NOT real security. The published CSV is public regardless. */
    const PASSWORD = "";

    /* 3) Auto-refresh interval in minutes (manual Refresh button always available). */
    const AUTO_REFRESH_MINUTES = 5;
  </script>

  <!-- Optional password gate -->
  <div id="gate" hidden>
    <div class="box">
      <h3>🔒 Protected</h3>
      <p>Enter the password to view the tracker.</p>
      <input type="password" id="gate-input" placeholder="Password" />
      <div class="err" id="gate-err"></div>
      <button id="gate-btn">Unlock</button>
    </div>
  </div>

  <main class="container" id="app" hidden>

    <!-- Header -->
    <header class="app-header">
      <div>
        <h1>📬 Wind Divin Outreach Tracker</h1>
        <p class="sub">Live view · Nas.Creatives Mgmt · read-only — edits happen in the Google Sheet</p>
      </div>
      <div class="header-actions">
        <span class="updated" id="updated">—</span>
        <button class="btn-refresh" id="refresh">↻ Refresh</button>
      </div>
    </header>

    <!-- Loading / error / setup states -->
    <div id="status-area"></div>

    <!-- Everything below is hidden until data loads -->
    <div id="content" hidden>

      <!-- Summary stats -->
      <div class="stats-grid" id="stats"></div>

      <!-- Chart -->
      <div class="panel">
        <p class="section-title">Contacts by status</p>
        <div class="chart-wrap"><canvas id="statusChart" height="120"></canvas></div>
      </div>

      <!-- Filters -->
      <div class="panel">
        <p class="section-title">Filter &amp; search</p>
        <div class="filter-bar">
          <div class="field">
            <label for="search">Search all fields</label>
            <input type="search" id="search" placeholder="Name, region, notes, email…" />
          </div>
          <div class="field">
            <label>Category</label>
            <div class="ms" id="ms-category">
              <div class="ms-toggle" tabindex="0"><span class="ms-label">All categories</span><span class="chev">▾</span></div>
              <div class="ms-menu"></div>
            </div>
          </div>
          <div class="field">
            <label>Status</label>
            <div class="ms" id="ms-status">
              <div class="ms-toggle" tabindex="0"><span class="ms-label">All statuses</span><span class="chev">▾</span></div>
              <div class="ms-menu"></div>
            </div>
          </div>
          <div class="field">
            <label for="region">Region</label>
            <select id="region"><option value="">All regions</option></select>
          </div>
        </div>
        <div class="filter-meta">
          <span class="count" id="result-count"></span>
          <button class="btn-clear" id="clear">Clear all filters</button>
        </div>
      </div>

      <!-- Table -->
      <div class="panel">
        <div class="table-scroll">
          <table>
            <thead><tr id="head-row"></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>

    </div>
  </main>

  <script>
  /* ============================================================
     APP LOGIC  (vanilla JS, no frameworks)
     ============================================================ */

  // Table columns: [key in row object, display label, css class]
  const COLUMNS = [
    ["Name",          "Name",          "name"],
    ["Category",      "Category",      "cat"],
    ["Region",        "Region",        "region"],
    ["Contact Info",  "Contact",       "contact"],
    ["Status",        "Status",        "status"],
    ["Last Contacted","Last Contacted","last"],
    ["Next Step",     "Next Step",     "next"],
    ["Assigned To",   "Assigned To",   "assigned"],
    ["Notes",         "Notes",         "notes"],
  ];
  const PER_PAGE = 20;

  // App state
  let allRows = [];
  let filtered = [];
  let page = 1;
  let sortKey = "Name";
  let sortDir = 1; // 1 asc, -1 desc
  let chart = null;
  let refreshTimer = null;

  const $ = (sel) => document.querySelector(sel);

  /* ---------- CSV parsing (handles quoted fields, commas, newlines) ---------- */
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], next = text[i + 1];
      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === '\r') { /* ignore */ }
        else { field += c; }
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToObjects(rows) {
    if (!rows.length) return [];
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1)
      .filter(r => r.some(c => c.trim() !== "")) // drop blank lines
      .map(r => {
        const o = {};
        headers.forEach((h, i) => { o[h] = (r[i] || "").trim(); });
        return o;
      });
  }

  /* ---------- Status normalization & coloring ---------- */
  // Returns { label, badgeClass } for any status string (case-insensitive).
  function statusInfo(raw) {
    const s = (raw || "").toLowerCase().trim();
    if (s.startsWith("not contact"))  return { label: raw || "Not contacted", cls: "red" };
    if (s.startsWith("awaiting"))     return { label: raw, cls: "blue" };
    if (s === "done" || s.startsWith("complete")) return { label: raw, cls: "green" };
    if (s.startsWith("contact"))      return { label: raw, cls: "yellow" }; // "Contacted"
    if (!s) return { label: "—", cls: "gray" };
    return { label: raw, cls: "gray" };
  }

  // Canonical status buckets for the chart & stat cards
  const STATUS_BUCKETS = [
    { key: "Not Contacted", match: s => s.startsWith("not contact"), color: "#ef4444" },
    { key: "Contacted",     match: s => s.startsWith("contact"),     color: "#d97706" },
    { key: "Awaiting Reply",match: s => s.startsWith("awaiting"),    color: "#2563eb" },
    { key: "Done",          match: s => s === "done" || s.startsWith("complete"), color: "#16a34a" },
  ];
  function bucketOf(raw) {
    const s = (raw || "").toLowerCase().trim();
    const b = STATUS_BUCKETS.find(b => b.match(s));
    return b ? b.key : "Other";
  }

  /* ---------- Contact cell: render mailto / link ---------- */
  function contactCell(value) {
    const v = (value || "").trim();
    if (!v) return "—";
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
      return `<a href="mailto:${escapeAttr(v)}">${escapeHtml(v)}</a>`;
    }
    if (/^https?:\/\//i.test(v)) {
      const label = v.replace(/^https?:\/\//i, "").replace(/\/$/, "");
      return `<a href="${escapeAttr(v)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
    }
    return escapeHtml(v); // plain text (e.g. "Cultural attache at diplomatic missions")
  }

  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------- Data load ---------- */
  async function loadData(isManual) {
    const btn = $("#refresh");
    btn.disabled = true; btn.textContent = "↻ Loading…";

    if (!CSV_URL) { renderSetup(); btn.disabled = false; btn.textContent = "↻ Refresh"; return; }

    if (!allRows.length) showLoading();
    try {
      // cache-bust so manual refresh always gets the latest publish
      const url = CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_=" + Date.now();
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (text.trim().startsWith("<")) throw new Error("Got HTML, not CSV — check the publish settings/URL.");
      allRows = rowsToObjects(parseCSV(text));
      if (!allRows.length) throw new Error("Sheet appears to be empty.");
      clearState();
      buildFilterOptions();
      applyFilters();
      renderStats();
      renderChart();
      $("#updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch (err) {
      renderError(err.message);
    } finally {
      btn.disabled = false; btn.textContent = "↻ Refresh";
    }
  }

  /* ---------- State renderers ---------- */
  function showLoading() {
    $("#content").hidden = true;
    $("#status-area").innerHTML = `<div class="state"><div class="spinner"></div><p>Loading contacts…</p></div>`;
  }
  function clearState() { $("#status-area").innerHTML = ""; $("#content").hidden = false; }
  function renderError(msg) {
    $("#content").hidden = true;
    $("#status-area").innerHTML = `
      <div class="state error">
        <h3>⚠️ Couldn't load the tracker</h3>
        <p>${escapeHtml(msg)}</p>
        <p style="font-size:.85rem">Check that the Google Sheet is still published to the web as CSV and that the URL in <code class="url">CSV_URL</code> is correct. Then hit Refresh.</p>
      </div>`;
  }
  function renderSetup() {
    $("#content").hidden = true;
    $("#status-area").innerHTML = `
      <div class="state">
        <h3>🛠️ Almost ready — add your sheet URL</h3>
        <p>Open this file and paste your published Google Sheet CSV link into the
        <code class="url">CSV_URL</code> constant near the top of the page.</p>
        <p style="font-size:.85rem">Google Sheets → <b>File → Share → Publish to web → Comma-separated values (.csv)</b>,
        then copy the <code class="url">…/pub?output=csv</code> URL.</p>
      </div>`;
  }

  /* ---------- Stats ---------- */
  function renderStats() {
    const total = allRows.length;
    const catCounts = countBy(allRows, "Category");
    const wrap = $("#stats");
    const catCards = [
      { label: "Radio",        cat: "Radio",            accent: "#6d28d9" },
      { label: "Sync",         cat: "Sync Licensing",   accent: "#0ea5e9" },
      { label: "Venues / NGOs",cat: "Venue/Festival/NGO", accent: "#f59e0b" },
      { label: "Booking",      cat: "Booking Platform", accent: "#16a34a" },
    ];
    let html = `<div class="stat-card total"><div class="label">Total contacts</div><div class="value">${total}</div></div>`;
    catCards.forEach(c => {
      html += `<div class="stat-card"><div class="label">${c.label}</div><div class="value">${catCounts[c.cat] || 0}</div><div class="accent" style="background:${c.accent}"></div></div>`;
    });
    // status cards
    STATUS_BUCKETS.forEach(b => {
      const n = allRows.filter(r => bucketOf(r.Status) === b.key).length;
      html += `<div class="stat-card"><div class="label">${b.key}</div><div class="value">${n}</div><div class="accent" style="background:${b.color}"></div></div>`;
    });
    wrap.innerHTML = html;
  }

  function countBy(arr, key) {
    return arr.reduce((m, r) => { const v = r[key] || "—"; m[v] = (m[v]||0)+1; return m; }, {});
  }

  /* ---------- Chart ---------- */
  function renderChart() {
    const labels = STATUS_BUCKETS.map(b => b.key);
    const data = STATUS_BUCKETS.map(b => allRows.filter(r => bucketOf(r.Status) === b.key).length);
    const colors = STATUS_BUCKETS.map(b => b.color);
    const ctx = $("#statusChart");
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: "bar",
      data: { labels, datasets: [{ label: "Contacts", data, backgroundColor: colors, borderRadius: 8, maxBarThickness: 90 }] },
      options: {
        responsive: true, maintainAspectRatio: true,
        plugins: { legend: { display: false }, tooltip: { backgroundColor: "#1e1b2e" } },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#eee" } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  /* ---------- Filters ---------- */
  function uniqueSorted(key) { return [...new Set(allRows.map(r => (r[key]||"").trim()).filter(Boolean))].sort(); }

  function buildFilterOptions() {
    // Category multiselect (use canonical categories present in data)
    buildMultiselect("ms-category", uniqueSorted("Category"), "All categories");
    // Status multiselect
    buildMultiselect("ms-status", uniqueSorted("Status"), "All statuses");
    // Region single-select
    const region = $("#region");
    const cur = region.value;
    region.innerHTML = `<option value="">All regions</option>` + uniqueSorted("Region").map(r => `<option value="${escapeAttr(r)}">${escapeHtml(r)}</option>`).join("");
    region.value = cur;
  }

  function buildMultiselect(id, values, allLabel) {
    const root = document.getElementById(id);
    const menu = root.querySelector(".ms-menu");
    // preserve checked values across rebuilds
    const checked = new Set([...menu.querySelectorAll("input:checked")].map(i => i.value));
    menu.innerHTML = values.map(v =>
      `<label><input type="checkbox" value="${escapeAttr(v)}" ${checked.has(v)?"checked":""}>${escapeHtml(v)}</label>`
    ).join("");
    menu.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => { updateMsLabel(root, allLabel); page = 1; applyFilters(); }));
    updateMsLabel(root, allLabel);
  }

  function updateMsLabel(root, allLabel) {
    const sel = [...root.querySelectorAll("input:checked")];
    const labelEl = root.querySelector(".ms-label");
    if (sel.length === 0) labelEl.innerHTML = allLabel;
    else if (sel.length === 1) labelEl.textContent = sel[0].value;
    else labelEl.innerHTML = `${sel.length} selected <span class="ms-count">${sel.length}</span>`;
  }

  function getMsValues(id) { return [...document.getElementById(id).querySelectorAll("input:checked")].map(i => i.value); }

  function applyFilters() {
    const q = $("#search").value.toLowerCase().trim();
    const cats = getMsValues("ms-category");
    const stats = getMsValues("ms-status");
    const region = $("#region").value;

    filtered = allRows.filter(r => {
      if (cats.length && !cats.includes(r.Category)) return false;
      if (stats.length && !stats.includes(r.Status)) return false;
      if (region && r.Region !== region) return false;
      if (q) {
        const hay = Object.values(r).join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    sortRows();
    renderTable();
  }

  function sortRows() {
    filtered.sort((a, b) => {
      const va = (a[sortKey]||"").toLowerCase(), vb = (b[sortKey]||"").toLowerCase();
      if (va < vb) return -1 * sortDir;
      if (va > vb) return  1 * sortDir;
      return 0;
    });
  }

  /* ---------- Table render ---------- */
  function renderHead() {
    $("#head-row").innerHTML = COLUMNS.map(([key, label]) => {
      const sorted = key === sortKey;
      const arrow = sorted ? (sortDir === 1 ? "▲" : "▼") : "↕";
      return `<th data-key="${escapeAttr(key)}" class="${sorted?"sorted":""}">${escapeHtml(label)} <span class="arrow">${arrow}</span></th>`;
    }).join("");
    $("#head-row").querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (key === sortKey) sortDir *= -1; else { sortKey = key; sortDir = 1; }
      sortRows(); renderTable(); renderHead();
    }));
  }

  function renderTable() {
    renderHead();
    const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
    if (page > totalPages) page = totalPages;
    const start = (page - 1) * PER_PAGE;
    const slice = filtered.slice(start, start + PER_PAGE);
    const body = $("#body");

    if (!slice.length) {
      body.innerHTML = `<tr><td colspan="${COLUMNS.length}" style="text-align:center;color:var(--muted);padding:2rem">No contacts match these filters.</td></tr>`;
    } else {
      body.innerHTML = slice.map(r => "<tr>" + COLUMNS.map(([key,,cls]) => {
        let inner;
        if (cls === "contact")      inner = contactCell(r[key]);
        else if (cls === "status")  { const s = statusInfo(r[key]); inner = `<span class="badge ${s.cls}">${escapeHtml(s.label)}</span>`; }
        else if (cls === "cat")     inner = `<span class="cat-tag">${escapeHtml(r[key]||"—")}</span>`;
        else                        inner = escapeHtml(r[key]||"") || "—";
        return `<td class="${cls}">${inner}</td>`;
      }).join("") + "</tr>").join("");
    }

    $("#result-count").textContent = `${filtered.length} of ${allRows.length} contacts`;
    renderPager(totalPages);
  }

  function renderPager(totalPages) {
    const p = $("#pager");
    if (totalPages <= 1) { p.innerHTML = ""; return; }
    p.innerHTML = `
      <button id="first" ${page===1?"disabled":""}>« First</button>
      <button id="prev"  ${page===1?"disabled":""}>‹ Prev</button>
      <span class="page-info">Page ${page} of ${totalPages}</span>
      <button id="next"  ${page===totalPages?"disabled":""}>Next ›</button>
      <button id="last"  ${page===totalPages?"disabled":""}>Last »</button>`;
    $("#first").onclick = () => { page = 1; renderTable(); };
    $("#prev").onclick  = () => { page--;   renderTable(); };
    $("#next").onclick  = () => { page++;   renderTable(); };
    $("#last").onclick  = () => { page = totalPages; renderTable(); };
  }

  /* ---------- Wire up filter controls ---------- */
  function initControls() {
    $("#search").addEventListener("input", () => { page = 1; applyFilters(); });
    $("#region").addEventListener("change", () => { page = 1; applyFilters(); });
    $("#refresh").addEventListener("click", () => loadData(true));
    $("#clear").addEventListener("click", () => {
      $("#search").value = ""; $("#region").value = "";
      document.querySelectorAll(".ms input:checked").forEach(cb => cb.checked = false);
      document.querySelectorAll(".ms").forEach(ms => updateMsLabel(ms, ms.querySelector(".ms-label").textContent.includes("categ")?"All categories":"All statuses"));
      buildFilterOptions();
      page = 1; applyFilters();
    });

    // multiselect open/close
    document.querySelectorAll(".ms").forEach(ms => {
      ms.querySelector(".ms-toggle").addEventListener("click", (e) => {
        e.stopPropagation();
        document.querySelectorAll(".ms.open").forEach(o => { if (o !== ms) o.classList.remove("open"); });
        ms.classList.toggle("open");
      });
    });
    document.addEventListener("click", () => document.querySelectorAll(".ms.open").forEach(o => o.classList.remove("open")));
  }

  /* ---------- Password gate ---------- */
  function initGate() {
    if (!PASSWORD) { $("#app").hidden = false; start(); return; }
    const gate = $("#gate"); gate.hidden = false;
    const tryUnlock = () => {
      if ($("#gate-input").value === PASSWORD) { gate.hidden = true; $("#app").hidden = false; start(); }
      else { $("#gate-err").textContent = "Incorrect password."; }
    };
    $("#gate-btn").addEventListener("click", tryUnlock);
    $("#gate-input").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
    $("#gate-input").focus();
  }

  /* ---------- Boot ---------- */
  function start() {
    initControls();
    loadData(false);
    if (AUTO_REFRESH_MINUTES > 0) {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => loadData(false), AUTO_REFRESH_MINUTES * 60 * 1000);
    }
  }

  document.addEventListener("DOMContentLoaded", initGate);
  </script>
</body>
</html>
